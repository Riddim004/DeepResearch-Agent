[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepresearch-agent"
version = "1.0.0"
description = "An autonomous, self-correcting research agent built on LangGraph."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.2.0",
    "langchain-openai>=0.1.7",
    "langgraph>=0.1.0",
    "ddgs>=6.0.0",
    "streamlit>=1.33.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
deepresearch = "deepresearch.__main__:main"

[tool.setuptools]
packages = ["deepresearch", "deepresearch.evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
